version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - node -e "require('fs').rmSync('.next', { recursive: true, force: true })"
        - npm run build
        - node -e "console.log('[unieconnect] OMS chunks:', require('fs').readdirSync('.next/static/chunks').filter((name) => /^99\\./.test(name)).join(', '))"
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
